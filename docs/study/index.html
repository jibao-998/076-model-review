<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>076 · 右舷实体遮挡候选</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,sans-serif;color:#203944;background:#edf2f4}header{display:flex;gap:12px;align-items:center;padding:10px 16px;background:white;border-bottom:1px solid #d4e0e4;flex-wrap:wrap}header strong{color:#11747a}a{color:#087680}button,select{min-height:44px;border:1px solid #bfd1d7;border-radius:7px;background:white;color:#264b58;padding:8px 12px;font:inherit}button[aria-pressed=true]{background:#127579;color:white}#canvas{position:relative;height:calc(100dvh - 150px);min-height:220px}canvas{display:block}#tag{position:absolute;left:12px;top:12px;max-width:390px;padding:9px 12px;background:#ffffffed;border:1px solid #d4e0e4;border-radius:8px;pointer-events:none;font-size:12px;line-height:1.6}#tools{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;background:white;flex-wrap:wrap;border-top:1px solid #d4e0e4}#status{padding:4px 14px;font-size:12px;min-height:24px}#details{position:absolute;right:12px;top:12px;max-width:280px;background:#fffe;padding:10px;display:none;overflow-wrap:anywhere}label{display:flex;align-items:center;gap:4px}#failure{color:#942f24} @media(max-width:600px){header{font-size:12px;padding:6px 10px;gap:6px}#canvas{height:calc(100dvh - 204px)}#tag{max-width:240px;font-size:11px}#tools{padding:4px;gap:4px}button,select{padding:7px 9px;font-size:12px}}@media(max-height:500px){header{padding:3px 10px}header span{display:none}#canvas{height:calc(100dvh - 113px)}#tools{padding:4px}#tag{font-size:10px;max-width:280px;padding:4px 8px}}
</style><link rel="stylesheet" href="marine.css?rev=baea4789d61691ca"></head><body>
<header><strong>076 · 右舷候选研究</strong><span>800 mm · D模型设计 · 未选型 / 不可加工</span><a href="report.html">证据与未完成项</a><a href="076_v11_right_candidate.3dm" download>候选 .3dm</a><a href="../index.html#v10">整船评审</a></header>
<main id="canvas"><div id="tag"></div><div id="details"></div></main>
<nav id="tools" aria-label="右舷观察与运动"><label>几何<select id="version"><option value="candidate">V11 遮挡候选</option><option value="old">V10 原版</option></select></label><label>显示<select id="mode"><option value="opaque">完整不透明装配</option><option value="structure">结构评审</option><option value="drive">驱动空间研究</option></select></label><button data-pos="0">上</button><button data-pos="50">中</button><button data-pos="100">下</button><select id="angle" aria-label="观察视角"><option value="front">观察口正视</option><option value="fore">前斜45°</option><option value="aft">后斜45°</option><option value="above">稍俯20°</option><option value="below">稍仰20°</option><option value="iso">整船三维</option></select><button id="lights" aria-pressed="true">机库灯</button><button id="share">分享状态</button></nav><div id="status">正在读取几何…</div>
<script src="three.min.js"></script><script src="OrbitControls.js"></script><script src="study_data.js"></script><script>
'use strict';
const data=window.STUDY_DATA,$=id=>document.getElementById(id),host=$('canvas'),renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x3b5365);renderer.outputEncoding=THREE.sRGBEncoding;host.appendChild(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-100,100,80,-80,.1,4000);camera.up.set(0,0,1);const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=false;
scene.add(new THREE.HemisphereLight(0xffffff,0x72747b,.95));const sun=new THREE.DirectionalLight(0xffffff,.65);sun.position.set(100,200,400);scene.add(sun);const lamp=new THREE.PointLight(0xffedcb,.9,160);lamp.position.set(456,0,62);scene.add(lamp);
const groups={candidate:new THREE.Group(),old:new THREE.Group(),cad:new THREE.Group()},all=[];Object.values(groups).forEach(g=>scene.add(g));
function add(p,group){if(p.line||p.temporary)return;const geom=new THREE.BufferGeometry();geom.setAttribute('position',new THREE.Float32BufferAttribute(p.vertices.flat(),3));geom.setIndex(p.faces.flat());geom.computeVertexNormals();const m=new THREE.Mesh(geom,new THREE.MeshStandardMaterial({color:p.color||'#9eb2bc',roughness:.8,metalness:0,side:THREE.DoubleSide,transparent:!!p.reserved,opacity:p.reserved?.22:1,depthWrite:!p.reserved}));m.userData=p;group.add(m);all.push(m)}
data.parts.forEach(p=>add(p,groups.candidate));data.previous_parts.forEach(p=>add(p,groups.old));data.cad_reference_parts.filter(p=>p.pose==='closed').forEach(p=>add(p,groups.cad));
let state={version:'candidate',mode:'opaque',position:50,angle:'front',lights:true},half=50;
function visibility(){groups.candidate.visible=state.version==='candidate';groups.old.visible=state.version==='old';groups.cad.visible=state.mode==='drive'&&state.version==='candidate';for(const m of all){const p=m.userData;m.visible=p.group==='CAD'||(state.mode==='opaque'?!p.reserved:state.mode==='drive'?!['skin','deck','superstructure'].includes(p.group):!p.reserved&&!['skin','deck','superstructure'].includes(p.group));if(p.assembly==='ELEVATOR_STBD')m.position.z=-32*state.position/100}
lamp.visible=state.lights;$('lights').setAttribute('aria-pressed',state.lights);for(const b of document.querySelectorAll('[data-pos]'))b.setAttribute('aria-pressed',Number(b.dataset.pos)===state.position);$('tag').innerHTML=(state.version==='candidate'?'V11 实体衬板候选':'V10 原版几何')+' · 平台'+({0:'上位',50:'中位',100:'下位'}[state.position])+'<br>不透明装配保留全部实体机构；自然遮挡允许。<br><strong id="failure">遮挡检查 FAIL · 未选型 / 未制造放行</strong>';$('status').textContent='遮挡 FAIL · 右舷候选 · 完整驱动与防坠未完成 · 检修尚未复核 · 点击零件看名称';}
function observe(){const c=new THREE.Vector3(456,53,57.5);let a=0,e=0,dist=350;half=43;if(state.angle==='fore')a=-Math.PI/4;if(state.angle==='aft')a=Math.PI/4;if(state.angle==='above')e=20*Math.PI/180;if(state.angle==='below')e=-20*Math.PI/180;if(state.angle==='iso'){c.set(400,0,40);dist=1100;a=-.8;e=.5;half=400}camera.position.copy(c).add(new THREE.Vector3(Math.sin(a)*Math.cos(e),Math.cos(a)*Math.cos(e),Math.sin(e)).multiplyScalar(dist));controls.target.copy(c);camera.lookAt(c);resize();controls.update()}
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h);camera.top=half;camera.bottom=-half;camera.left=-half*w/h;camera.right=half*w/h;camera.updateProjectionMatrix()}
function sync(){for(const k of ['version','mode','angle'])$(k).value=state[k];visibility()}
for(const k of ['version','mode','angle'])$(k).onchange=()=>{state[k]=$(k).value;visibility();if(k==='angle')observe()};document.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{state.position=Number(b.dataset.pos);visibility()});$('lights').onclick=()=>{state.lights=!state.lights;visibility()};
$('share').onclick=async()=>{const s={...state,camera:camera.position.toArray(),target:controls.target.toArray(),half,zoom:camera.zoom},url=location.href.split('#')[0]+'#'+encodeURIComponent(JSON.stringify(s));history.replaceState(null,'',url);try{await navigator.clipboard.writeText(url);$('status').textContent='已复制当前几何、平台、灯光及相机状态'}catch{prompt('复制当前状态链接',url)}};
try{if(location.hash){Object.assign(state,JSON.parse(decodeURIComponent(location.hash.slice(1))))}}catch{}sync();observe();if(state.camera){camera.position.fromArray(state.camera);controls.target.fromArray(state.target);half=state.half;camera.zoom=state.zoom||1;resize();controls.update()}
const ray=new THREE.Raycaster();renderer.domElement.addEventListener('pointerdown',ev=>{const b=renderer.domElement.getBoundingClientRect();ray.setFromCamera(new THREE.Vector2((ev.clientX-b.left)/b.width*2-1,-(ev.clientY-b.top)/b.height*2+1),camera);const roots=state.version==='candidate'?groups.candidate:groups.old;const hits=ray.intersectObjects(roots.children).filter(h=>h.object.visible);if(hits.length){const p=hits[0].object.userData;$('details').style.display='block';$('details').textContent=p.name+' | '+p.group+' | D模型设计 / 评审候选';setTimeout(()=>$('details').style.display='none',5500)}});
window.addEventListener('resize',resize);function frame(){requestAnimationFrame(frame);renderer.render(scene,camera)}frame();window.study={state,camera,controls,scene,renderer,setState(s){Object.assign(state,s);sync();observe()},ready:true};
</script></body></html>
